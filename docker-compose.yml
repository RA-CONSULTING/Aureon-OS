# Aureon root container protection preflight.
# Public local build of the guarded non-live image. The service returns HOLD
# and starts no Aureon runtime. No env file, no secret, no published port,
# and no volume are set here. The service has no network and opens no
# listener. The environment block only pins order-safety defaults; it is
# not a secret list and it does not enable trading. Release boundary stays
# HOLD. Registry publish is outside this file.
# See docs/deployment/PUBLIC_CONTAINER.md.
services:
  protection-preflight:
    build:
      context: .
      dockerfile: Dockerfile
    image: aureon-protection-preflight:local
    restart: "no"
    command: []
    environment:
      AUREON_LIVE_TRADING: "0"
      AUREON_DISABLE_REAL_ORDERS: "1"
      AUREON_DISABLE_EXCHANGE_MUTATIONS: "1"
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
