# Aureon root container protection preflight.
# Public local build of the guarded non-live image. The service returns HOLD
# and starts no Aureon runtime. No env block, no env file, no secret, no
# published port, and no volume are set here. The service has no network and
# opens no listener. Not a supported cloud go-live. Not production ready.
# Release boundary stays HOLD. Registry publish is outside this file.
# See docs/deployment/PUBLIC_CONTAINER.md.
services:
  protection-preflight:
    build:
      context: .
      dockerfile: Dockerfile
    image: aureon-protection-preflight:local
    restart: "no"
    command: []
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
