[supervisord]
nodaemon=false
logfile=/workspaces/aureon-trading/logs/supervisord.log
pidfile=/workspaces/aureon-trading/supervisord.pid

[unix_http_server]
file=/workspaces/aureon-trading/supervisor.sock   ; (the path to the socket file)

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspaces/aureon-trading/supervisor.sock ; use a unix:// URL  for a unix socket

[program:ws_feeder]
command=/workspaces/aureon-trading/venv/bin/python ws_market_data_feeder.py --binance --write-interval-s 1.0
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
startretries=3
stderr_logfile=/workspaces/aureon-trading/logs/ws_feeder.err.log
stdout_logfile=/workspaces/aureon-trading/logs/ws_feeder.out.log
environment=WS_PRICE_CACHE_PATH="/workspaces/aureon-trading/ws_cache/ws_prices.json"

[program:truth_engine]
command=/workspaces/aureon-trading/venv/bin/python aureon_live_tv_station.py
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
startretries=3
stderr_logfile=/workspaces/aureon-trading/logs/truth_engine.err.log
stdout_logfile=/workspaces/aureon-trading/logs/truth_engine.out.log
environment=WS_PRICE_CACHE_PATH="/workspaces/aureon-trading/ws_cache/ws_prices.json"

# 🛡️ PRIORITY 1: QUEEN SOUL SHIELD - Protection first
[program:queen_soul_shield]
command=python queen_soul_shield.py
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=1
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspaces/aureon-trading/logs/queen_soul_shield.log
environment=PYTHONUNBUFFERED=1

# 🌟 PRIORITY 5: DEPLOYMENT COORDINATOR - Status and health checks
[program:deployment_coordinator]
command=python deploy_digital_ocean.py
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=5
startsecs=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspaces/aureon-trading/logs/deployment_coordinator.log
environment=PYTHONUNBUFFERED=1

# 👑 PRIORITY 10: QUEEN ETERNAL MACHINE - The 7 Strategies (Main production loop)
[program:queen_eternal_machine]
command=python queen_eternal_machine.py --live --vault 50000 --interval 10
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=10
startsecs=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspaces/aureon-trading/logs/queen_eternal_machine.log
environment=PYTHONUNBUFFERED=1

# 🦬 PRIORITY 15: ORCA KILL CYCLE - Aggressive multi-exchange trader (spot + margin simultaneous)
[program:orca_trader]
command=/workspaces/aureon-trading/venv/bin/python orca_complete_kill_cycle.py --autonomous --symbols BTC/USD,ETH/USD,SOL/USD,ADA/USD,DOGE/USD --initial-capital 10000 50 10.0 1.0
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=15
startretries=3
stderr_logfile=/workspaces/aureon-trading/logs/orca_trader.err.log
stdout_logfile=/workspaces/aureon-trading/logs/orca_trader.out.log
environment=WS_PRICE_CACHE_PATH="/workspaces/aureon-trading/ws_cache/ws_prices.json"

# 🧠 PRIORITY 50: AUREON OPERATOR / COGNITION - Grounded agentic mind + phone PoC
# Serves the switchboard, the agentic cognition (repo-wide grounding + tools + veto),
# and the mobile chat page. Joins the mycelium mesh + Queen hive on startup.
# Distinct port (8790) so it never collides with the Power Station (8080).
[program:aureon_operator]
numprocs=1
command=python -m aureon.operator.operator_server
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=50
startsecs=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspaces/aureon-trading/logs/aureon_operator.log
environment=PYTHONUNBUFFERED=1,AUREON_OPERATOR_PORT="8790"

# 🫁 PRIORITY 55: ORGANISM DAEMON - The metacognitive layer, finally breathing.
# ConsciousnessModule senses all ThoughtBus traffic; the Connectome progressively
# touches every module of the body and pulses honest coverage. Import side effects
# are suppressed so mass-touching can never flip trading env toward live mode.
[program:aureon_organism]
command=python -m aureon.core.organism_daemon
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=55
startsecs=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspaces/aureon-trading/logs/aureon_organism.log
environment=PYTHONUNBUFFERED=1,AUREON_SUPPRESS_IMPORT_SIDE_EFFECTS="1"

# 🌐 PRIORITY 56: HNC LIVE DAEMON - The Λ(t) field driver.
# Layer-1 fetchers (Schumann, space weather, GDELT, macro) -> LambdaEngine kernel
# -> state/hnc_live_trace.jsonl consumed by the harmonic observer and the Queen.
[program:hnc_live_daemon]
command=python -m aureon.core.hnc_live_daemon
directory=/workspaces/aureon-trading
autostart=true
autorestart=true
priority=56
startsecs=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspaces/aureon-trading/logs/hnc_live_daemon.log
environment=PYTHONUNBUFFERED=1
