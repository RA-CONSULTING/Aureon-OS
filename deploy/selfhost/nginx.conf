worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log /var/log/nginx/access.log;
  log_format structured escape=json
    '{"ts":"$time_iso8601","status":$status,"method":"$request_method","path":"$uri","upstream":"$upstream_addr","replica_request":"$request_id"}';
  access_log /dev/stdout structured;

  limit_req_zone $binary_remote_addr zone=aureon_api:10m rate=2r/s;
  limit_req_status 429;

  upstream aureon_api {
    server api_a:8765;
    server api_b:8765;
  }

  server {
    listen 80;
    server_name _;

    location = /healthz {
      proxy_pass http://aureon_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    location = /readyz {
      proxy_pass http://aureon_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/ {
      limit_req zone=aureon_api burst=3 nodelay;
      proxy_pass http://aureon_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    location = /error-test {
      limit_req zone=aureon_api burst=3 nodelay;
      proxy_pass http://aureon_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /app/ {
      proxy_pass http://frontend:5173/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location / {
      root /usr/share/nginx/html/console;
      try_files $uri $uri/ /index.html;
    }
  }
}
