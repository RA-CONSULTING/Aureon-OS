[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# Terminal master-launcher protection preflight. It imports no Aureon target,
# starts no subprocess or listener, and has retries disabled. There is no
# environment flag that authorizes execution in this configuration.

[program:aureon-master]
command=/usr/local/bin/python -I -S -B /app/scripts/bootstrap/protected_bootstrap_v05.py --target-id master-launcher
directory=/app
autostart=true
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PORT="8080",COMMAND_CENTER_PORT="8800",MARKET_CACHE_DIR="/app/ws_cache",AUREON_STATE_DIR="/app/state",AUREON_LIVE_TRADING="0",PYTHONGC="700,5,5"

