[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/app/aureon-os/runtime/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/aureon-os/runtime/supervisor.sock

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --dir "%(ENV_AUREON_RUNTIME_DIR)s" --daemonize no
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=%(ENV_AUREON_PG_BIN)s/postgres -D %(ENV_PGDATA)s -k %(ENV_AUREON_PGSOCK)s -h 127.0.0.1 -p %(ENV_PGPORT)s
priority=15
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:error_sink]
command=/usr/local/bin/python -u /app/aureon-os/deploy/selfhost/error_sink.py
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:aureon_model]
; This process downloads only the exact Hub commit, hashes the weights, loads
; bf16 on CUDA, completes a startup generation, and only then opens 11435.
command=/bin/bash /app/aureon-os/deploy/huggingface/model_service.sh
priority=25
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api_a]
command=/usr/local/bin/python -u -m aureon_fusion.http_service
environment=AUREON_FUSION_PORT="8765",AUREON_REPLICA_ID="api_a",AUREON_LOG_PATH="%(ENV_AUREON_RUNTIME_DIR)s/logs/api_a.jsonl"
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api_b]
command=/usr/local/bin/python -u -m aureon_fusion.http_service
environment=AUREON_FUSION_PORT="8766",AUREON_REPLICA_ID="api_b",AUREON_LOG_PATH="%(ENV_AUREON_RUNTIME_DIR)s/logs/api_b.jsonl"
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:operator]
; The early seat answers liveness. Full construction waits for a real own-model
; inference probe, so an unavailable provider is never accepted as readiness.
command=/usr/local/bin/python -u -m aureon.operator.operator_server
priority=35
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:demo_api]
command=/usr/local/bin/python -u /app/aureon-os/deploy/huggingface/demo_api.py
environment=AUREON_OPERATOR_API_KEY="",AUREON_FUSION_API_TOKEN=""
priority=40
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/local/bin/python -u -m aureon.operator.local_http_profile --serve --host 127.0.0.1 --port 5173 --root /app/aureon-os/frontend/dist
priority=42
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fleet]
; The public allowlist permits HNC supervision only; no exchange executor,
; self-repair, self-coding, queen restart, or other mutating organ is launched.
command=/usr/local/bin/python -u -m aureon_fusion.unity_supervisor --interval 45
priority=48
autorestart=true
startsecs=10
startretries=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:hnc_core]
command=/usr/local/bin/python -u -m aureon_fusion.hnc_core --supervise
priority=50
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /app/aureon-os/runtime/nginx.conf
priority=60
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:smoke]
; One-shot release gate: any failed required row exits nonzero and is logged.
command=/usr/local/bin/python -u /app/aureon-os/deploy/huggingface/smoke.py
priority=90
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
