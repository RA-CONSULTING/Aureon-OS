worker_processes 1;
error_log /dev/stderr warn;
pid /app/aureon-os/runtime/nginx.pid;

events {
  worker_connections 512;
}

http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /app/aureon-os/runtime/nginx/client;
  proxy_temp_path /app/aureon-os/runtime/nginx/proxy;
  fastcgi_temp_path /app/aureon-os/runtime/nginx/fastcgi;
  uwsgi_temp_path /app/aureon-os/runtime/nginx/uwsgi;
  scgi_temp_path /app/aureon-os/runtime/nginx/scgi;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=aureon_read:10m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=aureon_generate:10m rate=12r/m;
  limit_req_status 429;

  upstream aureon_api {
    server 127.0.0.1:8765 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8766 max_fails=2 fail_timeout=5s;
  }
  upstream operator_api {
    server 127.0.0.1:8790 max_fails=2 fail_timeout=5s;
  }
  upstream demo_api {
    server 127.0.0.1:8792 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 7860;
    server_name _;
    client_max_body_size 16k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
      limit_except GET HEAD { deny all; }
      proxy_pass http://operator_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header Cache-Control "no-store" always;
    }

    # Strict aggregate readiness: operator + exact verified CUDA model + posture.
    location = /readyz {
      limit_except GET HEAD { deny all; }
      proxy_pass http://demo_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header Cache-Control "no-store" always;
    }

    # Reviewed, exact operator reads. No credential, terminal, provider,
    # connection, approval, switchboard, pulse, fleet, SSE, or future prefix
    # route inherits this injected internal bearer.
    location ~ ^/api/(status|organism|cognition|metacognition|affect|soul|inner-work|pursuit|defense|catalog|domains)$ {
      limit_req zone=aureon_read burst=4 nodelay;
      limit_except GET HEAD { deny all; }
      proxy_pass http://operator_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "Bearer __AUREON_OPERATOR_KEY__";
      proxy_read_timeout 60s;
      add_header Cache-Control "no-store" always;
    }
    location ~ ^/api/cognition/(brain|bus|connectome|field|mycelium)$ {
      limit_req zone=aureon_read burst=4 nodelay;
      limit_except GET HEAD { deny all; }
      proxy_pass http://operator_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Authorization "Bearer __AUREON_OPERATOR_KEY__";
      proxy_read_timeout 60s;
      add_header Cache-Control "no-store" always;
    }

    location = /api/demo/status {
      limit_req zone=aureon_read burst=4 nodelay;
      limit_except GET HEAD { deny all; }
      proxy_pass http://demo_api;
      proxy_set_header Authorization "";
      add_header Cache-Control "no-store" always;
    }
    location ~ ^/api/hnc/(status|replay|organism-replay)$ {
      limit_req zone=aureon_read burst=4 nodelay;
      limit_except GET HEAD { deny all; }
      proxy_pass http://demo_api;
      proxy_set_header Authorization "";
      proxy_read_timeout 120s;
      add_header Cache-Control "no-store" always;
    }

    # The sole anonymous POST is bounded, deterministic, and owns no tool or
    # exchange authority. It calls Aureon's strict loopback own-model adapter.
    location = /api/demo/generate {
      limit_req zone=aureon_generate burst=2 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://demo_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization "";
      proxy_read_timeout 650s;
      add_header Cache-Control "no-store" always;
    }

    # One authenticated Fusion read, with a random per-boot internal token.
    location = /fusion/api/status {
      limit_req zone=aureon_read burst=4 nodelay;
      limit_except GET HEAD { deny all; }
      proxy_pass http://aureon_api/api/status;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Authorization "Bearer __AUREON_FUSION_TOKEN__";
      proxy_read_timeout 60s;
      add_header Cache-Control "no-store" always;
    }

    # No bearer, including the real internal bearer, unlocks a public mutation
    # or an unreviewed read. Distinguish anonymous requests for smoke testing.
    location /api/ {
      if ($http_authorization = "") { return 401; }
      return 403;
    }
    location /fusion/ {
      if ($http_authorization = "") { return 401; }
      return 403;
    }
    location /mcp/ {
      if ($http_authorization = "") { return 401; }
      return 403;
    }

    location /hnc/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://demo_api;
      proxy_set_header Authorization "";
      add_header Cache-Control "no-store" always;
    }
    location = /hnc {
      limit_except GET HEAD { deny all; }
      proxy_pass http://demo_api;
      proxy_set_header Authorization "";
      add_header Cache-Control "no-store" always;
    }
    location /app/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://127.0.0.1:5173/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
    location /assets/ {
      limit_except GET HEAD { deny all; }
      root /app/aureon-os/frontend/dist;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      limit_except GET HEAD { deny all; }
      root /app/aureon-os/frontend/dist;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }
  }
}
