; Aureon — full-system process definition for Linux (native, current paths).
; ─────────────────────────────────────────────────────────────────────────────
; Every program is currently routed to the fixed stdlib-only protection HOLD.
; No Aureon module, Node process, or trading path is started until a reviewed
; native release handoff replaces this fail-closed phase-one configuration.
;
; SAFETY: live trading is OFF unless AUREON_LIVE_TRADING=1 (code default "0"); the
; hard boundary (conscience veto, AUREON_LOCAL_ACTIONS_ARMED / AUREON_SOUL_ACT stay
; unset) holds regardless — no autonomous irreversible execution.

[supervisord]
nodaemon=true
logfile=state/logs/supervisord.log
pidfile=state/supervisord.pid
childlogdir=state/logs
loglevel=info

[unix_http_server]
file=state/supervisor.sock

[supervisorctl]
serverurl=unix://state/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── organism core ────────────────────────────────────────────────────────────
[program:hnc-live-daemon]
command=%(ENV_AUREON_PYTHON)s -I -S -B %(ENV_AUREON_ROOT)s/scripts/bootstrap/protected_bootstrap_v05.py --target-id hnc
priority=10
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=state/logs/hnc-live-daemon.log
redirect_stderr=true

[program:organism-daemon]
command=%(ENV_AUREON_PYTHON)s -I -S -B %(ENV_AUREON_ROOT)s/scripts/bootstrap/protected_bootstrap_v05.py --target-id organism
priority=11
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=state/logs/organism-daemon.log
redirect_stderr=true

[program:operator]
numprocs=1
command=%(ENV_AUREON_PYTHON)s -I -S -B %(ENV_AUREON_ROOT)s/scripts/bootstrap/protected_bootstrap_v05.py --target-id operator
priority=12
environment=AUREON_OPERATOR_PORT="8790",AUREON_OPERATOR_HOST="0.0.0.0"
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=state/logs/operator.log
redirect_stderr=true

