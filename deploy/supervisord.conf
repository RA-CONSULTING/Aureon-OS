[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# ════════════════════════════════════════════════════════════════════════════════
# ⚡ AUREON POWER STATION - ENERGY-FOCUSED TRADING SYSTEM
# ════════════════════════════════════════════════════════════════════════════════
#
# 🔐 KRAKEN NONCE FIX: Uses file-based atomic nonce counter (.kraken_nonce)
#    This prevents "Invalid nonce" errors when multiple processes start together
#    Each process gets a guaranteed unique, incrementing nonce
#
# PRIMARY INTERFACE: Aureon Pro Dashboard (Port 8080)
#   - Bloomberg-style professional trading terminal
#   - Real-time portfolio P&L, live prices, whale/bot detection
#   - Queen's Cognitive Narrator with AI commentary
#   - /health endpoint for DigitalOcean health checks
#
# STARTUP ORDER (staggered to prevent API race conditions):
#   0. Aureon Pro Dashboard (priority=0) - PRIMARY interface + health checks
#   1. Binance WS Feeder (priority=3) - FREE data
#   2. Kraken Cache (priority=6) - DELAYED, backup data
#   3. Orca Kill Cycle (priority=10) - Execution engine
#   4. Autonomous Engine (priority=20) - Intelligence loops
#   5. Queen Redistribution (priority=25) - Energy optimization
#   6. Command Center (priority=50) - Secondary interface
#
# ARCHITECTURE:
#   Aureon Pro Dashboard → Bloomberg-style primary interface + /health
#   Queen Redistribution → Analyzes & optimizes energy across relays
#   Orca Execution → Executes energy moves
#   Autonomous Engine → Intelligence loops
#   Command Center → Internal operations dashboard
#
# ════════════════════════════════════════════════════════════════════════════════

# ⚡ AUREON PRO DASHBOARD - PRIMARY INTERFACE + HEALTH CHECKS (Port 8080)
# Bloomberg-style professional trading terminal with Queen's Cognitive Narrator
# NOW WITH: Hive Mind voice, Binance WebSocket, Market Flow, Rich Cognition
# CRITICAL: Must bind to 0.0.0.0:8080 for DigitalOcean health checks
# NOTE: Web server starts FIRST, then loads data in background — /health responds instantly
[program:aureon-pro-dashboard]
command=python -u -m aureon.monitors.aureon_pro_dashboard
directory=/app
autostart=true
autorestart=true
priority=0
startsecs=10
startretries=10
# ⚡ Memory limits for 99.99% efficiency - restart if exceeds 2GB
stopasgroup=true
killasgroup=true
exitcodes=0,2
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PORT="8080",AUREON_STATE_DIR="/app/state",PYTHONGC="700,5,5"

# ⚔️ ORCA KILL CYCLE - Trading Execution Engine
# ONLY starts after Command Center is healthy
# ONLY executes on Queen's commands (via ThoughtBus queen.decision.*)
[program:orca-engine]
command=bash /app/deploy/start_orca.sh
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=60
priority=10
# ⚡ Graceful shutdown for 99.99% efficiency
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",AUREON_ENABLE_AUTONOMOUS_CONTROL="1",HEALTH_PORT="8081",PYTHONGC="700,5,5"

# 🧠 AUTONOMOUS ENGINE - 9 Parallel Intelligence Loops
# Feeds Queen with additional intelligence signals
[program:autonomous-engine]
command=python -u -m aureon.autonomous.aureon_autonomous_worker
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=30
priority=20
# ⚡ Graceful shutdown for 99.99% efficiency
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",AUREON_ENABLE_AUTONOMOUS_CONTROL="1",PYTHONGC="700,5,5"

# 🐝 QUEEN POWER REDISTRIBUTION ENGINE
# Autonomous energy redistribution and power optimization
# Monitors idle energy, calculates drains, executes profitable moves
[program:queen-redistribution]
command=python -u -m aureon.queen.queen_power_redistribution --interval 10 --live
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=30
priority=25
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",AUREON_ENABLE_AUTONOMOUS_CONTROL="1"

# � COMMAND CENTER - Internal Operations Dashboard (Port 8800)
# Secondary interface for internal system monitoring
[program:command-center]
command=python -u -m aureon.command_centers.aureon_command_center_ui
directory=/app
autostart=true
autorestart=true
priority=50
startsecs=10
startretries=5
# ⚡ Graceful shutdown for 99.99% efficiency
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PORT="8800",AUREON_STATE_DIR="/app/state",AUREON_ENABLE_AUTONOMOUS_CONTROL="1",PYTHONGC="700,5,5"

# � BINANCE WEBSOCKET FEEDER - FREE REAL-TIME DATA (REPLACES KRAKEN REST!)
# This is the PRIMARY market data source - FREE WebSocket, no rate limits!
# All other processes read from ws_cache/unified_prices.json
[program:binance-ws-feeder]
command=python -u -m aureon.data_feeds.unified_market_cache --write-interval 1.0
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=10
priority=3
# ⚡ Graceful shutdown for 99.99% efficiency
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",MARKET_CACHE_DIR="/app/ws_cache",PYTHONGC="700,5,5"

# 🔄 KRAKEN CACHE FEEDER (BACKUP ONLY - Reduced frequency)
# Only runs every 120s as backup for symbols not on Binance
# Primary data comes from Binance WebSocket above
# CRITICAL: Lower frequency to avoid "EAPI:Rate limit exceeded"
[program:kraken-cache]
command=python -u -m aureon.exchanges.kraken_cache_feeder --interval-s 120
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=30
priority=6
# ⚡ Graceful shutdown for 99.99% efficiency
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",PYTHONGC="700,5,5"


# 🫁 ORGANISM DAEMON - The metacognitive layer, finally breathing in production.
# ConsciousnessModule senses all ThoughtBus traffic; the Connectome progressively
# touches every module of the body and pulses honest coverage. Import side effects
# suppressed so mass-touching can never flip trading env toward live mode.
[program:aureon-organism]
command=python -u -m aureon.core.organism_daemon
directory=/app
autostart=true
autorestart=true
priority=7
startsecs=15
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",AUREON_SUPPRESS_IMPORT_SIDE_EFFECTS="1"

# 🌐 HNC LIVE DAEMON - The Λ(t) field driver (Schumann/space-weather/GDELT fetchers
# -> LambdaEngine kernel -> state/hnc_live_trace.jsonl -> harmonic observer -> Queen).
[program:hnc-live-daemon]
command=python -u -m aureon.core.hnc_live_daemon
directory=/app
autostart=true
autorestart=true
priority=8
startsecs=15
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state"
