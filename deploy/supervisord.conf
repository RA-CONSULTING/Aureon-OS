[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

# Every program below is a fixed isolated protection preflight. No program
# imports its named target, binds a port, reads exchange credentials, or starts
# trading. All retries are disabled and no environment flag can release it.

# Held dashboard target.
[program:aureon-pro-dashboard]
command=/usr/local/bin/python -I -S -B /app/scripts/bootstrap/protected_bootstrap_v05.py --target-id cloud-pro-dashboard
directory=/app
autostart=true
autorestart=false
priority=0
startsecs=0
startretries=0
# Legacy process-envelope settings retained for compatibility; no target starts.
stopasgroup=true
killasgroup=true
exitcodes=0,2
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PORT="8080",AUREON_STATE_DIR="/app/state",PYTHONGC="700,5,5"

# Held Orca target.
# ONLY executes on Queen's commands (via ThoughtBus queen.decision.*)
[program:orca-engine]
command=/usr/local/bin/python -I -S -B /app/scripts/bootstrap/protected_bootstrap_v05.py --target-id cloud-orca
directory=/app
autostart=true
autorestart=false
startretries=0
startsecs=0
priority=10
# ⚡ Graceful shutdown for 99.99% efficiency
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=AUREON_STATE_DIR="/app/state",AUREON_ENABLE_AUTONOMOUS_CONTROL="1",HEALTH_PORT="8081",PYTHONGC="700,5,5"

# Held autonomous worker target.
# Feeds Queen with additional intelligence signals
