# Standalone Aureon Operator / Cognition service.
#   docker compose -f deploy/docker-compose.operator.yml up --build
#
# Provide model keys via a .env file or the shell environment; with none set the
# service runs fully offline on stub/local adapters. The operator bearer key is
# required for this deployment compose file, even when the service is loopback-only.
services:
  aureon-operator:
    build:
      context: ..
      dockerfile: deploy/operator.Dockerfile
    image: aureon-operator:latest
    # Keep the operator off the public network by default. A production host
    # must use a separately configured authenticated reverse proxy and firewall;
    # never route this service through the public marketing website.
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      AUREON_OPERATOR_ENV: "production"
      AUREON_OPERATOR_PORT: "8790"
      AUREON_OPERATOR_THREADS: "8"
      AUREON_OPERATOR_HTTP_PROCESSES: "1"
      AUREON_OPERATOR_REPLICAS: "1"
      AUREON_OPERATOR_API_KEY: "${AUREON_OPERATOR_API_KEY:?set a nonempty operator secret}"
      AUREON_OPERATOR_RATE_RPS: "${AUREON_OPERATOR_RATE_RPS:-10}"
      AUREON_OPERATOR_RATE_BURST: "${AUREON_OPERATOR_RATE_BURST:-20}"
      AUREON_OPERATOR_MAX_BODY: "${AUREON_OPERATOR_MAX_BODY:-262144}"
      # Empty means X-Forwarded-For is ignored. Set only to the exact ingress CIDR(s).
      AUREON_OPERATOR_TRUSTED_PROXY_CIDRS: "${AUREON_OPERATOR_TRUSTED_PROXY_CIDRS:-}"
      # Model keys (optional — omit for offline):
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Fully offline (no outbound calls):
      # AUREON_LLM_OFFLINE: "1"
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8790/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
