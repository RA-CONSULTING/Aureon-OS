[supervisord]
nodaemon=true
logfile=/tmp/aureon-protection-supervisor.log
pidfile=/tmp/aureon-protection-supervisor.pid

[program:aureon-production-protection-hold]
command=/usr/local/bin/python -I -S -B /aureon/app/scripts/bootstrap/protected_bootstrap_v05.py --target-id production-supervisor
directory=/aureon/app
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
