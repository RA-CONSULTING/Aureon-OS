# ═══════════════════════════════════════════════════════════════════════════
# 🎮👑 AUREON TRADING SYSTEM - DOCKER COMPOSE 👑🎮
# ═══════════════════════════════════════════════════════════════════════════
# Production deployment with all services
# Usage: docker-compose -f production/docker-compose.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════
  # Main Trading Engine - Supervisor Mode (All 43 systems in parallel)
  # ═══════════════════════════════════════════════════════════════════════
  aureon:
    build:
      context: ..
      dockerfile: production/Dockerfile
      args:
        VERSION: "1.0.0"
        BUILD_DATE: "${BUILD_DATE:-2026-02-05}"
    image: aureon-trading:latest
    container_name: aureon-game
    restart: unless-stopped
    
    # Supervisor mode (runs all 43 systems in parallel)
    command: ["--mode", "supervisor"]
    
    ports:
      - "8888:8888"   # Command Center UI
      - "8889:8889"   # API Gateway
      - "9090:9090"   # Metrics
    
    volumes:
      # Persistent data
      - aureon-data:/aureon/data
      - aureon-logs:/aureon/logs
      - aureon-config:/aureon/config
    
    environment:
      - AUREON_MODE=production
      - AUREON_DRY_RUN=false
      - AUREON_STATE_DIR=/aureon/data
      - TZ=UTC
      # 👑 QUEEN FULL AUTONOMY ENABLEMENT
      - AUREON_ENABLE_AUTONOMOUS_CONTROL=1
      - AUREON_AUTONOMY_LEVEL=SOVEREIGN
      - AUREON_EXECUTION_MODE=AUTONOMOUS
      - AUREON_TRADE_GATING=DISABLED
      - AUREON_APPROVAL_REQUIRED=0
      - AUREON_QUEEN_VETO=DISABLED
      - AUREON_SAFETY_CHECKS=VALIDATION_ONLY
      - AUREON_EXCHANGE_AUTONOMY=1
      - AUREON_CAPITAL_AUTONOMY=1
      - AUREON_PORTFOLIO_AUTONOMY=1
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource limits for safety
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - aureon-network

  # ═══════════════════════════════════════════════════════════════════════
  # Command Center UI (Web Dashboard)
  # ═══════════════════════════════════════════════════════════════════════
  command-center:
    deploy:
      replicas: 1
    image: aureon-trading:latest
    container_name: aureon-command-center
    restart: unless-stopped
    command: ["python", "app/aureon_command_center_ui.py"]
    ports:
      - "8800:8800"
    volumes:
      - aureon-data:/aureon/data
      - aureon-logs:/aureon/logs
      - aureon-config:/aureon/config
    environment:
      - AUREON_MODE=production
      - AUREON_STATE_DIR=/aureon/data
      - TZ=UTC
    networks:
      - aureon-network

  # ═══════════════════════════════════════════════════════════════════════
  # Prometheus Metrics (optional)
  # ═══════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: aureon-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    
    networks:
      - aureon-network

  # ═══════════════════════════════════════════════════════════════════════
  # Grafana Dashboard (optional)
  # ═══════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:latest
    container_name: aureon-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    
    environment:
      # REQUIRED: Set GF_ADMIN_PASSWORD in environment before starting
      # Example: export GF_ADMIN_PASSWORD=$(openssl rand -base64 32)
      # Grafana will fail to start if password is not set (no insecure default)
      - 'GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?ERROR: GF_ADMIN_PASSWORD must be set}'
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
    
    networks:
      - aureon-network
    
    depends_on:
      - prometheus

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  aureon-network:
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════
# Volumes (persistent storage)
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  aureon-data:
    name: aureon-data
  aureon-logs:
    name: aureon-logs
  aureon-config:
    name: aureon-config
  prometheus-data:
    name: aureon-prometheus-data
  grafana-data:
    name: aureon-grafana-data
