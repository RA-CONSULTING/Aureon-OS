name: Windows contract

# Voice runners, the release-update contract, the reviewed PowerShell
# builder, the sealed compiler contract, and the guarded install script
# are Windows entrypoints. They run here instead of being dropped on Linux
# with no record. Live trading stays off. This job does not deploy, does not
# boot the plug stack, and does not place orders.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-contract:
    name: voice and release contract
    runs-on: windows-latest
    env:
      AUREON_LIVE_TRADING: "0"
      AUREON_FUSION_ARM_LIVE: ""
      BINANCE_TESTNET: "true"
      PAPER_MODE: "true"
      AUREON_DISABLE_REAL_ORDERS: "1"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse guarded Windows install
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path (Get-Location) "install.ps1"
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output $_.ToString() }
            exit 1
          }
          Write-Output "install.ps1 parsed"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest pytest-timeout
      - name: Guarded Windows install contract
        env:
          PYTHONPATH: .
          AUREON_LIVE_TRADING: "0"
        run: python -m pytest tests/test_windows_guarded_install.py -q --tb=line --timeout=60
      - name: Voice runners and release update
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_voice_runner_paths.py tests/test_release_update.py -q --tb=line --timeout=60 -m "not live"
      - name: PowerShell builder and sealed compiler
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_website_source_rationalisation.py tests/test_design_candidate_control.py tests/test_design_candidate_test_evidence.py tests/test_design_candidate_test_policy_compiler.py -q --tb=line --timeout=180 -m "windows"
