name: gitleaks

# Guards the tree being merged. A full-history scan cannot go green until
# Gary decides to rewrite history: public main already contains the
# credentials listed in ROTATE_KEYS.md. This job does not rewrite history.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aureon-gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret scan of the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the current tree
        run: gitleaks detect --no-git --redact --source . --config .gitleaks.toml --verbose
