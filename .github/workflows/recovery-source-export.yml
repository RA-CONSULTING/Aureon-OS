name: recovery-source-export

on:
  push:
    branches:
      - recovery/plumber-main-export-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          tar \
            --exclude='./.git' \
            --exclude='./Aureon-OS-main.tar.gz' \
            -czf Aureon-OS-main.tar.gz .
          sha256sum Aureon-OS-main.tar.gz > Aureon-OS-main.tar.gz.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: aureon-os-main-source
          path: |
            Aureon-OS-main.tar.gz
            Aureon-OS-main.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
