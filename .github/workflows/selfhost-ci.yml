name: Self-hosted stack

# Brings up the compose stack and proves every production layer.
# Live trading stays off. No provider secrets. No long loops.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aureon-selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfhost:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUREON_LIVE_TRADING: "0"
      AUREON_FUSION_ARM_LIVE: ""
      AUREON_FUSION_API_TOKEN: local-selfhost-token
      AUREON_SELFHOST_MODE: compose
      AUREON_SELFHOST_BASE: http://127.0.0.1:8080
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest pytest-timeout redis
      - name: Stage and start the stack
        run: |
          python3 scripts/stage_selfhost_image.py
          mkdir -p deploy/selfhost/runtime
          chmod 777 deploy/selfhost/runtime
          docker compose -f deploy/selfhost/docker-compose.yml up -d --build --wait
      - name: Smoke every layer
        run: python3 scripts/selfhost_smoke.py
      - name: Contract tests
        run: python -m pytest tests/test_selfhost_contract.py tests/test_faculty_refresh.py tests/test_production_layers.py tests/test_fusion_http.py tests/test_sandbox_self_repair.py tests/test_protected_patch_denylist.py -q --tb=line --timeout=60
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/selfhost/docker-compose.yml down
