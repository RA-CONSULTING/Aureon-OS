name: Plug and play

# Clean checkout. Creates .venv, installs the lockfile, installs the dashboard,
# boots the local stack, and hits health, the operator, cognition, MCP, and
# the frontend. No provider secrets. Live trading stays off.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aureon-plug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: clean boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-plug.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Boot from a clean tree and smoke the endpoints
        run: ./install.sh --smoke
      - name: Static contract
        run: |
          .venv/bin/python -m pip install pytest pytest-timeout
          PYTHONPATH=. .venv/bin/python -m pytest tests/test_plug_and_play_static.py tests/test_credential_bootstrap.py -q --tb=line
