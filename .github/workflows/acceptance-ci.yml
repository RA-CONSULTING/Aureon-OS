          include-hidden-files: false
          retention-days: 7
      - name: Enforce the default fail-closed economic mutation boundary
        run: python -B scripts/validation/audit_economic_mutation_boundaries.py --compact

  cloudflare-static:
    name: Wrangler and Cloudflare paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install parser dependency from the frontend lockfile
        run: npm ci --prefix frontend --ignore-scripts
      - name: Build isolated Cloudflare static assets
        run: |
          bash flameborn/scripts/build_workers_assets.sh
          mkdir -p deploy/cloudflare/aureon_murge_worker/dist-workers
          cp -R flameborn/dist-workers/. deploy/cloudflare/aureon_murge_worker/dist-workers/
      - name: Run offline Cloudflare Worker security contract
        run: |
          node --check flameborn/workers/index.mjs
          node --check deploy/cloudflare/aureon_murge_worker/index.mjs
          node --check flameborn/cloudflare-ui/app.js
          node --check flameborn/script.js
          node --test tests/cloudflare_worker_security_contract.test.mjs
          node --test tests/cloudflare_workers_deploy_preflight_contract.test.mjs
      - name: Validate Cloudflare deployment inputs without network or deployment
        env:
          AUREON_WORKER_ACCESS_SECRET: ci-only-not-a-secret-0123456789abcdef
          AUREON_ALLOWED_ORIGINS: https://acceptance.invalid
        run: npm --prefix flameborn run cf:preflight
      - name: Parse Wrangler JSONC and resolve worker and asset paths
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const ts = require("./frontend/node_modules/typescript");

          const configs = [
            "deploy/cloudflare/aureon_murge_worker/wrangler.jsonc",
            "flameborn/wrangler.jsonc",
          ];
          const problems = [];
          for (const relative of configs) {
            const parsed = ts.parseConfigFileTextToJson(relative, fs.readFileSync(relative, "utf8"));
            if (parsed.error) {
              problems.push(`${relative}: ${ts.flattenDiagnosticMessageText(parsed.error.messageText, " ")}`);
              continue;
            }
            const config = parsed.config;
            const expectedLimiters = new Map([
              ["API_PREAUTH_RATE_LIMITER", { limit: 20, period: 60 }],
              ["API_RATE_LIMITER", { limit: 60, period: 60 }],
            ]);
            for (const [name, expected] of expectedLimiters) {
              const limiter = config.ratelimits?.find((item) => item.name === name);
              if (
                !limiter
                || !/^\d+$/.test(String(limiter.namespace_id))
                || limiter.simple?.limit !== expected.limit
                || limiter.simple?.period !== expected.period
              ) {
                problems.push(`${relative}: invalid ${name} binding`);
              }
            }
            if (JSON.stringify(config.assets?.run_worker_first) !== JSON.stringify(["/api", "/api/*"])) {
              problems.push(`${relative}: API paths can bypass Worker-first routing`);
            }
            for (const [label, configured] of [
              ["main", config.main],
              ["assets.directory", config.assets?.directory],
            ]) {
              if (typeof configured !== "string") {
                problems.push(`${relative}: missing ${label}`);
                continue;
              }
              const resolved = path.resolve(path.dirname(relative), configured);
              if (!fs.existsSync(resolved)) problems.push(`${relative}: ${label} does not resolve: ${configured}`);
            }
          }
          if (problems.length) throw new Error(problems.join("\n"));
          JS

  supabase-static:
    name: Supabase functions and RLS policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/acceptance-ci.yml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript parser from the frontend lockfile
        run: npm ci --prefix frontend --ignore-scripts
      - name: Parse every Supabase Edge Function without resolving remote imports
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const ts = require("./frontend/node_modules/typescript");

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const child = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(child) : child.endsWith(".ts") ? [child] : [];
            });
          }
          const failures = [];
          for (const file of walk("supabase/functions")) {
            const source = ts.createSourceFile(
              file,
              fs.readFileSync(file, "utf8"),
              ts.ScriptTarget.Latest,
              true,
              ts.ScriptKind.TS,
            );
            for (const diagnostic of source.parseDiagnostics) {
              failures.push(`${file}: ${ts.flattenDiagnosticMessageText(diagnostic.messageText, " ")}`);
            }
          }
          if (failures.length) throw new Error(failures.join("\n"));
          JS
      - name: Validate Supabase auth, quarantine, RLS, and function grants
        run: |
          test -f supabase/config.toml
          test -d supabase/functions
          test -d supabase/migrations
          python -B scripts/validation/audit_supabase_edge_auth.py
          python -m pytest --disable-socket \
            tests/test_supabase_edge_auth_contract.py \
            tests/test_supabase_live_only_edge_functions.py \
            tests/test_supabase_legacy_public_rls_migration.py \
            tests/test_supabase_privileged_function_hardening.py

  frontend:
    name: Frontend typecheck, lint, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run all three offline Playwright specifications
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ../artifacts/frontend-playwright.xml
        run: |
          mkdir -p ../artifacts
          npx --no-install playwright test \
            tests/shell-smoke.spec.ts \
            tests/live-data.spec.ts \
            tests/capability-forge.spec.ts \
            --project=chromium \
            --reporter=junit
      - name: Upload sanitized Playwright test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-frontend-playwright-${{ github.run_id }}
          path: artifacts/frontend-playwright.xml
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
