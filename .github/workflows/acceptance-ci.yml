name: Aureon Acceptance CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  AUREON_AUDIT_MODE: "1"
  LIVE: "0"
  DRY_RUN: "1"
  AUREON_LIVE_TRADING: "0"
  AUREON_LLM_OFFLINE: "1"
  AUREON_DISABLE_LLM_HTTP: "1"
  AUREON_SUPPRESS_IMPORT_SIDE_EFFECTS: "1"
  BINANCE_DRY_RUN: "true"
  KRAKEN_DRY_RUN: "true"
  ALPACA_DRY_RUN: "true"
  CAPITAL_DEMO: "true"

jobs:
  workflow-contract:
    name: workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/acceptance-ci.yml
      - name: Install contract-test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "PyYAML>=6,<7"
      - name: Validate acceptance workflow contract
        run: |
          mkdir -p artifacts
          python -m pytest tests/test_acceptance_ci_workflow_contract.py --junitxml=artifacts/workflow-contract.xml
      - name: Upload sanitized workflow test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-workflow-contract-${{ github.run_id }}
          path: artifacts/workflow-contract.xml
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

