  hosting-manifests:
    name: DigitalOcean and container manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/acceptance-ci.yml
      - name: Install static-manifest dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "PyYAML>=6,<7" "pytest-socket>=0.7,<1"
      - name: Parse DigitalOcean app specifications and resolve Dockerfiles
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path.cwd().resolve()
          for relative in (Path(".do/app.yaml"), Path("app.yaml")):
              payload = yaml.safe_load((root / relative).read_text(encoding="utf-8-sig"))
              assert isinstance(payload, dict), f"{relative} must contain one YAML mapping"
              assert isinstance(payload.get("services"), list) and payload["services"], (
                  f"{relative} must declare at least one service"
              )
              for service in payload["services"]:
                  source_dir = str(service.get("source_dir", ".")).lstrip("/") or "."
                  dockerfile = root / source_dir / service["dockerfile_path"]
                  assert dockerfile.resolve().is_relative_to(root), f"{relative} escapes the repository"
                  assert dockerfile.is_file(), f"{relative} references missing {dockerfile.relative_to(root)}"
          PY
      - name: Parse Docker Compose and Supervisor contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import configparser
          import yaml

          compose_paths = (
              "docker-compose.yml",
              "docker-compose.autonomous.yml",
              "deploy/docker-compose.operator.yml",
              "deploy/docker-compose.saas.yml",
              "production/docker-compose.yml",
          )
          supervisor_paths = (
              "supervisord.conf",
              "deploy/supervisord.conf",
              "deploy/supervisord.linux.conf",
              "deploy/supervisord.master_launcher.conf",
              "production/supervisord.conf",
          )
          dockerfiles = ("Dockerfile", "Dockerfile.ephemeris", "production/Dockerfile")
          for relative in compose_paths:
              payload = yaml.safe_load(Path(relative).read_text(encoding="utf-8-sig"))
              assert isinstance(payload, dict) and isinstance(payload.get("services"), dict), relative
              assert payload["services"], f"{relative} has no services"
          for relative in supervisor_paths:
              parser = configparser.ConfigParser(interpolation=None, strict=False)
              assert parser.read(relative, encoding="utf-8"), f"cannot parse {relative}"
              assert any(section.startswith("program:") for section in parser.sections()), relative
          for relative in dockerfiles:
              assert Path(relative).is_file(), f"missing {relative}"
          PY
          python -m pytest --disable-socket \
            tests/test_container_hosting_packaging_contract.py \
            tests/test_digitalocean_app_spec_fail_closed.py \
            tests/test_import_snapshot_quarantine.py \
            tests/test_single_writer_scaling_contract.py

