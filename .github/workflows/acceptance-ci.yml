      - name: Install economic census dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "pytest-socket>=0.7,<1"
      - name: Validate the frozen economic mutation census offline
        run: |
          mkdir -p artifacts
          python -m pytest --disable-socket \
