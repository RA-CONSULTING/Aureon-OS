name: Live sandbox

# Opt-in venue tests. Live trading stays off. This job never targets a
# mainnet host: the endpoint pins below are sandbox or testnet only.
# A pull request with no remaining live-marked tests exits 5 from pytest;
# that is a pass, because the recorded offline fixtures cover those paths.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  live-sandbox:
    name: live marker against sandbox
    runs-on: ubuntu-latest
    env:
      AUREON_LIVE_TRADING: "0"
      AUREON_DISABLE_REAL_ORDERS: "1"
      AUREON_DISABLE_EXCHANGE_MUTATIONS: "1"
      AUREON_LLM_OFFLINE: "1"
      KRAKEN_API_URL: "https://api.sandbox.kraken.com"
      BINANCE_API_URL: "https://testnet.binance.vision"
      ALPACA_API_BASE_URL: "https://paper-api.alpaca.markets"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse mainnet endpoints
        run: |
          python - <<'PY'
          import os, sys
          banned = ("https://api.kraken.com", "https://api.binance.com", "https://api.alpaca.markets")
          blob = "\n".join(f"{key}={value}" for key, value in sorted(os.environ.items()))
          for host in banned:
              if host in blob:
                  sys.exit(f"mainnet endpoint refused: {host}")
          print("sandbox endpoints only")
          PY
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" pytest-timeout
      - name: Run live-marked tests
        run: |
          set +e
          python -m pytest -m live -p no:randomly -q --timeout=60 -o addopts=
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "no live-marked tests collected; recorded offline fixtures cover the suite"
            exit 0
          fi
          exit "$code"
